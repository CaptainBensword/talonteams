name: TalonTeams
version: 2.1.0
main: com.talon.teams.TalonTeams
author: Talon
description: Team selection, chat, bases, trophies, and team-issued shields.

commands:
  team:
    description: Opens the Talon team menu and team commands.
    usage: /team
    aliases: [teams]

permissions:
  talonteams.use:
    description: Allows players to use normal TalonTeams features.
    default: true

  talonteams.admin:
    description: Allows administrators to manage teams, bases, and trophies.
    default: op
